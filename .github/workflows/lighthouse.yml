name: Lighthouse Audit

on:
  workflow_run:
    workflows: ["Deploy Portfolio Site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Audit deployed site
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://sauravbhattacharya001.github.io/sauravbhattacharya001/
            https://sauravbhattacharya001.github.io/sauravbhattacharya001/404.html
          configJson: |
            {
              "ci": {
                "collect": {
                  "settings": {
                    "chromeFlags": "--no-sandbox",
                    "preset": "desktop"
                  },
                  "numberOfRuns": 3
                },
                "assert": {
                  "assertions": {
                    "categories:performance": ["warn", {"minScore": 0.9}],
                    "categories:accessibility": ["error", {"minScore": 0.9}],
                    "categories:best-practices": ["warn", {"minScore": 0.9}],
                    "categories:seo": ["warn", {"minScore": 0.9}]
                  }
                }
              }
            }
          uploadArtifacts: true

      - name: Summary
        if: always()
        run: |
          echo "## 🔦 Lighthouse Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Page | Performance | Accessibility | Best Practices | SEO |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------------|---------------|----------------|-----|" >> $GITHUB_STEP_SUMMARY
          for manifest in ${{ steps.lighthouse.outputs.manifest }}; do
            echo "Raw manifest output available in artifacts" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full reports uploaded as workflow artifacts." >> $GITHUB_STEP_SUMMARY
