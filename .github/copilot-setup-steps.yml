# Copilot Setup Steps — Profile README
# Installs ALL dependencies so GitHub Copilot coding agents (Claude, Codex)
# can autonomously lint, test, and iterate on this repository.

name: Copilot Setup

on: workflow_dispatch

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install project dependencies
        run: npm install

      - name: Install global tooling
        run: npm install -g markdownlint-cli2

      - name: Run tests
        run: npm test

      - name: Lint Markdown
        run: markdownlint-cli2 "**/*.md" || true

      - name: Verify environment
        run: |
          node --version
          npx jest --version
          markdownlint-cli2 --version
          echo "✅ Copilot agent environment ready"
