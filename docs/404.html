<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Saurav Bhattacharya</title>
    <!-- Match the security headers used by index.html and rheology.html.
         GitHub Pages cannot set HTTP headers, so meta http-equiv is the
         only way to enforce CSP / X-Content-Type-Options on the static
         deployment. Without these, a 404 landing (the most common entry
         point for typo'd URLs and broken links) was missing the same XSS,
         MIME-sniffing, and referrer hardening as the rest of the site. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <!-- Permissions-Policy disables browser features this page never uses,
         shrinking the attack surface available to any future injection. -->
    <meta http-equiv="Permissions-Policy"
          content="accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(self), usb=(), web-share=(), xr-spatial-tracking=()">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .error-message {
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: 0.5rem;
        }
        .error-hint {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            max-width: 480px;
        }
        .error-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .error-links a {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .error-links .primary {
            background: var(--accent);
            color: #fff;
        }
        .error-links .primary:hover {
            filter: brightness(1.15);
        }
        .error-links .secondary {
            border: 1px solid var(--border);
            color: var(--text);
        }
        .error-links .secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">404</div>
        <div class="error-message">Page not found</div>
        <p class="error-hint">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <div class="error-links">
            <a href="./" class="primary">← Back to Portfolio</a>
            <a href="https://github.com/sauravbhattacharya001" class="secondary" target="_blank" rel="noopener">GitHub Profile</a>
        </div>
    </div>
</body>
</html>
